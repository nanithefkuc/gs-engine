[package]
name = "gs-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Reusable Guruswami-Sudan list-decoding engine"
license = "MIT"
repository = "https://github.com/nanithefkuc/gs-engine"

[features]
default = ["std", "simd"]
std = ["fgf/std", "butterfly-fft/std", "gfm/std"]
simd = ["std", "fgf/simd", "butterfly-fft/simd", "gfm/simd"]
# Unstable implementation APIs for benchmarking and downstream
# experimentation. Exempt from compatibility guarantees.
internals = []
# Optional data parallelism over independent decode jobs, root families, and
# large scoring blocks. Default-off; requires `std`. The `no_std` core and
# single-thread behavior are unchanged when disabled.
parallel = ["std", "dep:rayon"]

[[bench]]
name = "root_extraction"
harness = false

[[bench]]
name = "decoder"
harness = false

[[bench]]
name = "products"
harness = false

[[bench]]
name = "scoring"
required-features = ["internals"]
harness = false

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "reencode"
harness = false

[[bench]]
name = "parallel"
required-features = ["parallel"]
harness = false

[dependencies]
# The same landed field/transform/ring sources the closure resolves, so one
# copy of each compiles. `poly-ring` takes `fft` unconditionally: the public
# decoder and root-lifting path requires the transform composition.
butterfly-fft = { git = "https://github.com/nanithefkuc/butterfly-fft", rev = "4003687405de80ae6c2665b4b7197f4657543d9e", default-features = false }
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "68cae1fa058e1900e24b9eb564efeb0189ad0f78", default-features = false }
poly-ring = { git = "https://github.com/nanithefkuc/poly-ring", rev = "4e11703375008dfdacdfe37e87f48b5ee5ed942e", default-features = false, features = ["fft"] }
gfm = { git = "https://github.com/nanithefkuc/gfm", rev = "3eec6a643b3a88deed7ea05b5e9b2746bceff8f4", default-features = false }
rayon = { version = "1", optional = true }


[dev-dependencies]
# Default features pull in plotters + rayon, which this harness does not use.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }