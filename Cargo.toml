[package]
name = "gs-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Reusable Guruswami-Sudan list-decoding engine"
license = "MIT"
repository = "https://github.com/nanithefkuc/gs-engine"

[features]
default = ["std", "simd"]
std = ["fgf/std", "butterfly-fft/std", "gfm/std"]
simd = ["std", "fgf/simd", "butterfly-fft/simd", "gfm/simd"]
# Unstable implementation APIs for benchmarking and downstream
# experimentation. Exempt from compatibility guarantees.
internals = []

[[bench]]
name = "root_extraction"
harness = false

[[bench]]
name = "decoder"
harness = false

[[bench]]
name = "products"
harness = false

[[bench]]
name = "scoring"
required-features = ["internals"]
harness = false

[[bench]]
name = "interpolation"
harness = false

[dependencies]
butterfly-fft = { git = "https://github.com/nanithefkuc/butterfly-fft", rev = "6b3f52485bfff2664d6b0c92452137e618a60932", default-features = false }
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "d0e331cec2e6ae5645e529597fa913db467a44cd", default-features = false }
gfm = { path = "../gfm", default-features = false }


[dev-dependencies]
# Default features pull in plotters + rayon, which this harness does not use.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }